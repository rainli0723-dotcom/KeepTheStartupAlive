version: "3.9"

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ktsa
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ktsa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktsa -d ktsa"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    ports:
      - "5432:5432"

  # KTSA Web application (Next.js)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ktsa:${DB_PASSWORD:-change-me}@db:5432/ktsa?schema=public
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT_MS: "120000"
      LLM_MAX_RETRIES: "2"
      LLM_TEMPERATURE: "0.4"
      LLM_WORKER_TOKEN: ${LLM_WORKER_TOKEN:-change-me-worker-token}
      KTSA_APP_URL: ${KTSA_APP_URL:-http://localhost:3000}
      DATABASE_POOL_MIN: "2"
      DATABASE_POOL_MAX: "10"
      DATA_RETENTION_DAYS: "365"
      REPORT_SHARE_DEFAULT_DAYS: "30"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # LLM Background Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ktsa:${DB_PASSWORD:-change-me}@db:5432/ktsa?schema=public
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT_MS: "120000"
      LLM_MAX_RETRIES: "2"
      LLM_WORKER_TOKEN: ${LLM_WORKER_TOKEN:-change-me-worker-token}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
